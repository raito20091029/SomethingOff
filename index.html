<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>寿司屋経営ゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Yu Gothic",sans-serif;background:#f5efe5;color:#292522}
button{font:inherit;cursor:pointer;border:0}#app{min-height:100vh;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto;background:#fff;border-radius:18px;padding:18px 24px;box-shadow:0 5px 20px #0001}.money{font-size:26px;font-weight:700}
main{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px #0001}
.shop{min-height:550px;text-align:center}.lane{height:390px;margin:20px -10px 18px;position:relative;overflow:hidden;background:radial-gradient(circle,#eadcc8 0 35%,#c49a67 36% 43%,#6f431f 44% 100%);border:10px solid #3b2415;border-radius:28px;box-shadow:inset 0 8px 20px #0005}
.laneTrack{position:absolute;left:50%;top:50%;width:430px;height:270px;transform:translate(-50%,-50%);border-radius:90px;border:34px solid #333;box-shadow:0 0 0 6px #666,0 0 0 10px #222,inset 0 0 0 6px #555}
.plate{position:absolute;width:72px;height:72px;border-radius:50%;background:#eee;border:7px solid #ddd;box-shadow:0 5px 8px #0005;display:flex;align-items:center;justify-content:center;font-size:34px;z-index:2;pointer-events:none}
.customer{position:absolute;width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid #d7a35b;box-shadow:0 4px 8px #0003;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:4;transition:transform .2s}
.customer.eating{transform:scale(1.12)}.seatLabel{position:absolute;font-size:12px;color:#5b4028;font-weight:700;z-index:1}
.order{font-size:20px;margin-bottom:14px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.stat{background:#f7f3ed;padding:12px 16px;border-radius:12px;flex:1;min-width:120px}
.upgrade{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.upgrade:last-child{border:0}.upgrade small{display:block;color:#777;margin-top:4px}
.buy{background:#e85d3f;color:#fff;padding:9px 14px;border-radius:9px}.buy:disabled{background:#bbb;cursor:not-allowed}
@media(max-width:800px){main{grid-template-columns:1fr}#app{padding:12px}.lane{height:360px}}
</style></head>
<body><div id="app">
<header><div><strong>🍣 すし屋「いちばん」</strong><div style="color:#777">お客さんにお寿司を食べてもらおう！</div></div><div class="money" id="money">¥0</div></header>
<main><section class="card shop"><h2>🍣 回転レーン</h2>
<div class="lane" id="lane"><div class="laneTrack"></div></div>
<div class="order" id="order">お客さんがお寿司を取っています…</div>
<div class="stats"><div class="stat">1皿の売上<br><b id="income">¥10</b></div><div class="stat">お客さん<br><b id="customers">3人</b></div><div class="stat">人気<br><b id="popularity">★☆☆☆☆</b></div></div>
</section><section class="card"><h2>🛠️ お店をアップグレード</h2><div id="upgrades"></div></section></main></div>
<script>
let money=0,income=10,speed=1,popularity=1;
const upgrades=[
{id:"knife",name:"🔪 包丁",desc:"1皿の売上 +¥10",cost:50},{id:"chef",name:"👨‍🍳 職人の腕",desc:"1皿の売上 +¥25",cost:150},
{id:"seat",name:"🪑 席を増やす",desc:"お客さん +1人",cost:400},{id:"shop",name:"🏮 店舗改装",desc:"1皿の売上 +¥100",cost:1000}];
const levels={knife:0,chef:0,seat:0,shop:0};
const sushiTypes=["🍣","🍤","🥚","🍙","🐟","🥑"],customerTypes=["👩","👨","🧑","👵","👨‍🍳","🧑‍💼"];
let sushiTimer=null,customerTimer=null,sushis=[],customers=[],lastFrame=performance.now();
const moneyEl=document.getElementById("money"),incomeEl=document.getElementById("income"),popEl=document.getElementById("popularity");
function yen(n){return "¥"+Math.floor(n).toLocaleString("ja-JP")}
function customerCount(){return 3+levels.seat}
function makeCustomers(){
 customers.forEach(c=>c.el.remove());customers=[];
 const lane=document.getElementById("lane"),cx=lane.clientWidth/2,cy=lane.clientHeight/2,r=177,n=customerCount();
 for(let i=0;i<n;i++){
  const el=document.createElement("div");el.className="customer";el.textContent=customerTypes[i%customerTypes.length];
  const a=(Math.PI*2*i/n)+Math.PI/2;el.style.left=(cx+Math.cos(a)*r-31)+"px";el.style.top=(cy+Math.sin(a)*r-31)+"px";
  lane.appendChild(el);customers.push({el,angle:a,cooldown:Math.random()*1500});
 }
 document.getElementById("customers").textContent=n+"人";
}
function spawnSushi(angle=null){
 const lane=document.getElementById("lane"),plate=document.createElement("div");plate.className="plate";
 plate.textContent=sushiTypes[Math.floor(Math.random()*sushiTypes.length)];lane.appendChild(plate);
 const s={el:plate,angle:angle===null?Math.random()*Math.PI*2:angle,value:income};sushis.push(s);
}
function moveSushi(dt){
 const lane=document.getElementById("lane"),cx=lane.clientWidth/2,cy=lane.clientHeight/2;
 const w=430,h=270,r=100;
 const straightX=w/2-r, straightY=h/2-r;
 const perimeter=2*straightX+2*straightY+2*Math.PI*r;
 sushis=sushis.filter(s=>{
  if(!s.el.isConnected)return false;
  s.distance=(s.distance||0)+0.075*dt;
  const d=((s.distance%perimeter)+perimeter)%perimeter;
  let x,y;
  if(d<straightX){
   x=-straightX/2+d; y=-h/2+r;
  }else if(d<straightX+Math.PI*r/2){
   const a=-Math.PI/2+(d-straightX)/r;
   x=straightX/2+r*Math.cos(a); y=-straightY+r*Math.sin(a);
  }else if(d<straightX+Math.PI*r/2+straightY){
   const q=d-(straightX+Math.PI*r/2);
   x=straightX/2; y=-straightY+q;
  }else if(d<straightX+Math.PI*r/2+straightY+Math.PI*r/2){
   const a=0+(d-(straightX+Math.PI*r/2+straightY))/r;
   x=straightX/2+r*Math.cos(a); y=straightY+r*Math.sin(a);
  }else if(d<straightX+Math.PI*r+straightY+Math.PI*r/2){
   const q=d-(straightX+Math.PI*r/2+straightY+Math.PI*r/2);
   x=straightX/2-q; y=straightY+r;
  }else if(d<straightX+Math.PI*r+straightY+Math.PI*r){
   const a=Math.PI/2+(d-(straightX+Math.PI*r+straightY+Math.PI*r/2))/r;
   x=-straightX/2+r*Math.cos(a); y=straightY+r*Math.sin(a);
  }else{
   const q=d-(straightX+Math.PI*r+straightY+Math.PI*r);
   x=-straightX/2; y=straightY-q;
  }
  s.el.style.left=(cx+x-36)+"px";
  s.el.style.top=(cy+y-36)+"px";
  s.el.style.zIndex=5;
  return true;
 });
}
function customersEat(){
 const lane=document.getElementById("lane"),cx=lane.clientWidth/2,cy=lane.clientHeight/2;
 customers.forEach(c=>{
  c.cooldown-=16;if(c.cooldown>0)return;
  let best=null,dist=999;
  sushis.forEach(s=>{let d=Math.abs(Math.atan2(Math.sin(s.angle-c.angle),Math.cos(s.angle-c.angle)));if(d<dist){dist=d;best=s}});
  if(best&&dist<0.12&&Math.random()<0.25){
   money+=best.value;popularity=Math.min(5,popularity+0.05);best.el.remove();sushis=sushis.filter(x=>x!==best);
   c.el.classList.add("eating");setTimeout(()=>c.el.classList.remove("eating"),300);
   document.getElementById("order").textContent="お客さんが"+yen(best.value)+"のお寿司を食べました！";
   c.cooldown=900+Math.random()*1300;render();
  }
 });
}
function startLane(){
 if(customerTimer)cancelAnimationFrame(customerTimer);
 sushis.forEach(s=>s.el.remove());sushis=[];lastFrame=performance.now();
 const count=10;
 for(let i=0;i<count;i++){
  spawnSushi();
  sushis[i].distance=(i/count)*(2*(430/2-100)+2*(270/2-100)+2*Math.PI*100);
 }
 makeCustomers();
 const loop=(now)=>{
  const dt=Math.min(40,now-lastFrame);lastFrame=now;
  moveSushi(dt);
  customersEat();
  customerTimer=requestAnimationFrame(loop);
 };
 customerTimer=requestAnimationFrame(loop);
}
function render(){
 moneyEl.textContent=yen(money);incomeEl.textContent=yen(income);popEl.textContent="★".repeat(Math.min(5,Math.floor(popularity)))+"☆".repeat(5-Math.min(5,Math.floor(popularity)));
 document.getElementById("customers").textContent=customerCount()+"人";
 document.getElementById("upgrades").innerHTML=upgrades.map(u=>{const lv=levels[u.id],cost=Math.floor(u.cost*Math.pow(1.65,lv));return '<div class="upgrade"><div><b>'+u.name+' Lv.'+lv+'</b><small>'+u.desc+'<br>次の価格 '+yen(cost)+'</small></div><button class="buy" '+(money<cost?"disabled":"")+' data-id="'+u.id+'">購入</button></div>'}).join("");
 document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>buy(b.dataset.id));
}
function buy(id){
 const u=upgrades.find(x=>x.id===id),lv=levels[id],cost=Math.floor(u.cost*Math.pow(1.65,lv));if(money<cost)return;
 money-=cost;levels[id]++;if(id==="knife")income+=10;if(id==="chef")income+=25;if(id==="seat"){popularity=Math.min(5,popularity+1);makeCustomers()}if(id==="shop")income+=100;render();
}
startLane();render();
</script></body></html>
