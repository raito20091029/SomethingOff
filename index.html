<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sushi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Yu Gothic",sans-serif}
#homeScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f4dfbd,#b9793c);user-select:none}
.homeTitle{font-family:Georgia,serif;font-size:clamp(80px,15vw,180px);font-weight:900;letter-spacing:10px;color:#21140c;text-shadow:0 8px 20px #0003}
.startText{margin-top:25px;font-size:clamp(20px,3vw,34px);color:#21140c;cursor:pointer}
#gameScreen{position:fixed;inset:0;display:none;background:#70421f}
.fullGame{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#6f401e,#a86d37 50%,#593117)}
.fullLane{position:absolute;inset:0;width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at center,#b47b43,#7a461f 70%);border:0}
.fullLane:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 48px,#ffffff09 49px 50px);pointer-events:none}
.serpentineLane{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.laneOuter{fill:none;stroke:#111;stroke-width:92;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 16px 18px #0008)}
.laneInner{fill:none;stroke:#666;stroke-width:64;stroke-linecap:round;stroke-linejoin:round}
.laneInner{stroke-dasharray:38 22}
.gameHud{position:absolute;z-index:50;top:0;left:0;right:0;padding:25px 32px;display:flex;justify-content:space-between;color:#fff;text-shadow:0 3px 8px #000;pointer-events:none}
.hudTitle{font:800 30px Georgia,serif;letter-spacing:4px}.hudMoney{font-size:28px;font-weight:800}
</style></head><body>
<div id="homeScreen"><div class="homeTitle">Sushi</div><div class="startText" id="startText">クリックしてスタート</div></div>
<div id="gameScreen"><div class="fullGame">
<div class="fullLane" id="lane">
<svg class="serpentineLane" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
<path class="laneOuter" d="M -80 75 H 900 C 980 75 980 175 900 175 H 100 C 20 175 20 275 100 275 H 900 C 980 275 980 375 900 375 H 100 C 20 375 20 475 100 475 H 1080"/>
<path class="laneInner" d="M -80 75 H 900 C 980 75 980 175 900 175 H 100 C 20 175 20 275 100 275 H 900 C 980 275 980 375 900 375 H 100 C 20 375 20 475 100 475 H 1080"/>
</svg>
</div>
<div class="gameHud"><div class="hudTitle">Sushi</div><div class="hudMoney" id="money">¥0</div></div>
</div></div>
<script>
let money=0,income=10,speed=1,popularity=1;
const upgrades=[
{id:"knife",name:"🔪 包丁",desc:"1皿の売上 +¥10",cost:50},{id:"chef",name:"👨‍🍳 職人の腕",desc:"1皿の売上 +¥25",cost:150},
{id:"seat",name:"🪑 席を増やす",desc:"お客さん +1人",cost:400},{id:"shop",name:"🏮 店舗改装",desc:"1皿の売上 +¥100",cost:1000}];
const levels={knife:0,chef:0,seat:0,shop:0};
const sushiTypes=[],customerTypes=["👩","👨","🧑","👵","👨‍🍳","🧑‍💼"];
let sushiTimer=null,customerTimer=null,sushis=[],customers=[],lastFrame=performance.now();
const moneyEl=document.getElementById("money"),incomeEl=document.getElementById("income"),popEl=document.getElementById("popularity");
function yen(n){return "¥"+Math.floor(n).toLocaleString("ja-JP")}
function customerCount(){return 3+levels.seat}
function makeCustomers(){
 customers.forEach(c=>c.el.remove());customers=[];
 const lane=document.getElementById("lane"),cx=lane.clientWidth/2,cy=lane.clientHeight/2,r=177,n=customerCount();
 for(let i=0;i<n;i++){
  const el=document.createElement("div");el.className="customer";el.textContent=customerTypes[i%customerTypes.length];
  const a=(Math.PI*2*i/n)+Math.PI/2;el.style.left=(cx+Math.cos(a)*r-31)+"px";el.style.top=(cy+Math.sin(a)*r-31)+"px";
  lane.appendChild(el);customers.push({el,angle:a,cooldown:Math.random()*1500});
 }
 document.getElementById("customers").textContent=n+"人";
}
function spawnSushi(){ return null; }

function moveSushi(dt){
 const lane=document.getElementById("lane"),cx=lane.clientWidth/2,cy=lane.clientHeight/2;
 const hx=198,hy=118,r=73;
 const topLen=2*(hx-r),sideLen=2*(hy-r),arc=Math.PI*r/2;
 const perimeter=2*topLen+2*sideLen+4*arc;
 sushis=sushis.filter(s=>{
  if(!s.el.isConnected)return false;
  s.distance=((s.distance||0)+0.075*dt)%perimeter;
  let d=s.distance,x,y;
  if(d<topLen){
   x=-(hx-r)+d;y=-hy;
  }else if(d<topLen+arc){
   const t=-Math.PI/2+(d-topLen)/r;
   const ax=hx-r,ay=-hy+r;x=ax+r*Math.cos(t);y=ay+r*Math.sin(t);
  }else if(d<topLen+arc+sideLen){
   x=hx;y=-(hy-r)+(d-topLen-arc);
  }else if(d<topLen+2*arc+sideLen){
   const t=(d-topLen-arc-sideLen)/r;
   const ax=hx-r,ay=hy-r;x=ax+r*Math.cos(t);y=ay+r*Math.sin(t);
  }else if(d<2*topLen+2*arc+sideLen){
   x=(hx-r)-(d-topLen-2*arc-sideLen);y=hy;
  }else if(d<2*topLen+3*arc+sideLen){
   const t=Math.PI/2+(d-topLen-2*arc-sideLen)/r;
   const ax=-hx+r,ay=hy-r;x=ax+r*Math.cos(t);y=ay+r*Math.sin(t);
  }else if(d<2*topLen+3*arc+2*sideLen){
   x=-hx;y=(hy-r)-(d-topLen-3*arc-sideLen);
  }else{
   const t=Math.PI+(d-topLen-3*arc-2*sideLen)/r;
   const ax=-hx+r,ay=-hy+r;x=ax+r*Math.cos(t);y=ay+r*Math.sin(t);
  }
  s.el.style.left=(cx+x-36)+"px";s.el.style.top=(cy+y-36)+"px";
  return true;
 });
}
function customersEat(){
 const lane=document.getElementById("lane"),cx=lane.clientWidth/2,cy=lane.clientHeight/2;
 customers.forEach(c=>{
  c.cooldown-=16;if(c.cooldown>0)return;
  let best=null,dist=999;
  sushis.forEach(s=>{let d=Math.abs(Math.atan2(Math.sin(s.angle-c.angle),Math.cos(s.angle-c.angle)));if(d<dist){dist=d;best=s}});
  if(best&&dist<0.12&&Math.random()<0.25){
   money+=best.value;popularity=Math.min(5,popularity+0.05);best.el.remove();sushis=sushis.filter(x=>x!==best);
   c.el.classList.add("eating");setTimeout(()=>c.el.classList.remove("eating"),300);
   document.getElementById("order").textContent="お客さんが"+yen(best.value)+"のお寿司を食べました！";
   c.cooldown=900+Math.random()*1300;render();
  }
 });
}
function startLane(){
 if(customerTimer)cancelAnimationFrame(customerTimer);
 document.querySelectorAll(".plate").forEach(el=>el.remove());
 sushis=[];lastFrame=performance.now();
 makeCustomers();
 const loop=(now)=>{
  const dt=Math.min(40,now-lastFrame);lastFrame=now;
  moveSushi(dt);customersEat();customerTimer=requestAnimationFrame(loop);
 };
 customerTimer=requestAnimationFrame(loop);
}
function render(){
 moneyEl.textContent=yen(money);incomeEl.textContent=yen(income);popEl.textContent="★".repeat(Math.min(5,Math.floor(popularity)))+"☆".repeat(5-Math.min(5,Math.floor(popularity)));
 document.getElementById("customers").textContent=customerCount()+"人";
 document.getElementById("upgrades").innerHTML=upgrades.map(u=>{const lv=levels[u.id],cost=Math.floor(u.cost*Math.pow(1.65,lv));return '<div class="upgrade"><div><b>'+u.name+' Lv.'+lv+'</b><small>'+u.desc+'<br>次の価格 '+yen(cost)+'</small></div><button class="buy" '+(money<cost?"disabled":"")+' data-id="'+u.id+'">購入</button></div>'}).join("");
 document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>buy(b.dataset.id));
}
function buy(id){
 const u=upgrades.find(x=>x.id===id),lv=levels[id],cost=Math.floor(u.cost*Math.pow(1.65,lv));if(money<cost)return;
 money-=cost;levels[id]++;if(id==="knife")income+=10;if(id==="chef")income+=25;if(id==="seat"){popularity=Math.min(5,popularity+1);makeCustomers()}if(id==="shop")income+=100;render();
}
</script>
<script>
const home=document.getElementById("homeScreen"),game=document.getElementById("gameScreen");
function startGame(){document.getElementById("homeScreen").style.display="none";document.getElementById("gameScreen").style.display="block";}
document.getElementById("startText").onclick=startGame;
home.onclick=e=>{if(e.target!==document.getElementById("startText"))startGame();};
</script></body></html>
