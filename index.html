<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寿司屋経営ゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Yu Gothic",sans-serif;background:#f5efe5;color:#292522}
button{font:inherit;cursor:pointer;border:0}
#app{min-height:100vh;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto;background:#fff;border-radius:18px;padding:18px 24px;box-shadow:0 5px 20px #0001}
.money{font-size:26px;font-weight:700}
main{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:1.4fr .8fr;gap:20px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px #0001}
.shop{min-height:420px;text-align:center}.lane{height:190px;margin:28px -22px 18px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#8b5a2b 0 8px,#6f431f 8px 16px);border-top:10px solid #3b2415;border-bottom:10px solid #3b2415;box-shadow:inset 0 8px 20px #0005}.laneTrack{position:absolute;left:0;right:0;top:72px;height:55px;background:#333;border-top:4px solid #555;border-bottom:4px solid #222}.plate{position:absolute;top:48px;width:92px;height:92px;border-radius:50%;background:#eee;border:7px solid #ddd;box-shadow:0 5px 8px #0005;display:flex;align-items:center;justify-content:center;font-size:43px;cursor:pointer;z-index:2;transition:transform .1s}.plate:hover{transform:scale(1.08)}
.sushi{font-size:110px;margin:30px 0 12px}
.order{font-size:20px;margin-bottom:20px}
.upgrade{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.upgrade:last-child{border:0}
.upgrade small{display:block;color:#777;margin-top:4px}
.buy{background:#e85d3f;color:#fff;padding:9px 14px;border-radius:9px}
.buy:disabled{background:#bbb;cursor:not-allowed}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:#f7f3ed;padding:12px 16px;border-radius:12px;flex:1;min-width:130px}
@media(max-width:800px){main{grid-template-columns:1fr}#app{padding:12px}}
</style>
</head>
<body>
<div id="app">
<header><div><strong>🍣 すし屋「いちばん」</strong><div style="color:#777">今日もお客さんを満足させよう！</div></div><div class="money" id="money">¥0</div></header>
<main>
<section class="card shop">
<h2>🍣 回転レーン</h2>
<div class="lane" id="lane"><div class="laneTrack"></div></div>
<div class="order" id="order">流れてくるお寿司をクリックして取ろう！</div>
<div class="stats">
<div class="stat">1皿の売上<br><b id="income">¥10</b></div>
<div class="stat">提供速度<br><b id="speed">普通</b></div>
<div class="stat">人気<br><b id="popularity">★☆☆☆☆</b></div>
</div>
</section>
<section class="card">
<h2>🛠️ お店をアップグレード</h2>
<div id="upgrades"></div>
</section>
</main>
</div>
<script>
let money=0, income=10, speed=1, popularity=1;
const upgrades=[
{id:"knife",name:"🔪 包丁",desc:"1皿の売上 +¥10",cost:50},
{id:"chef",name:"👨‍🍳 職人の腕",desc:"1皿の売上 +¥25",cost:150},
{id:"seat",name:"🪑 席を増やす",desc:"お客さんの注文単価UP",cost:400},
{id:"shop",name:"🏮 店舗改装",desc:"1皿の売上 +¥100",cost:1000}
];
const levels={knife:0,chef:0,seat:0,shop:0};
const moneyEl=document.getElementById("money"),incomeEl=document.getElementById("income"),popEl=document.getElementById("popularity"),speedEl=document.getElementById("speed");
const sushiTypes=["🍣","🍤","🥚","🍙","🐟","🥑"];
let sushiTimer;
function yen(n){return "¥"+Math.floor(n).toLocaleString("ja-JP")}
function spawnSushi(){
 const lane=document.getElementById("lane");
 const plate=document.createElement("button");
 plate.className="plate";
 plate.textContent=sushiTypes[Math.floor(Math.random()*sushiTypes.length)];
 plate.style.left="-100px";
 const value=income;
 plate.title="¥"+value+"のお寿司";
 plate.onclick=()=>{money+=value;popularity=Math.min(5,popularity+0.05);plate.remove();document.getElementById("order").textContent="お寿司を取った！ +"+yen(value);render();};
 lane.appendChild(plate);
 let x=-100;
 const moveSpeed=1.6+speed*0.15;
 clearInterval(plate._timer);
 plate._timer=setInterval(()=>{
   x+=moveSpeed;
   plate.style.left=x+"px";
   if(x>lane.clientWidth+100){clearInterval(plate._timer);plate.remove();}
 },16);
}
function startLane(){clearInterval(sushiTimer);spawnSushi();sushiTimer=setInterval(spawnSushi,1800);}
function render(){
 moneyEl.textContent=yen(money);incomeEl.textContent=yen(income);
 popEl.textContent="★".repeat(Math.min(5,popularity))+"☆".repeat(5-Math.min(5,popularity));
 speedEl.textContent=speed>=3?"高速":speed>=2?"速い":"普通";
 document.getElementById("upgrades").innerHTML=upgrades.map(u=>{
   const lv=levels[u.id]; const cost=Math.floor(u.cost*Math.pow(1.65,lv));
   return '<div class="upgrade"><div><b>'+u.name+' Lv.'+lv+'</b><small>'+u.desc+'<br>次の価格 '+yen(cost)+'</small></div><button class="buy" '+(money<cost?"disabled":"")+' data-id="'+u.id+'">購入</button></div>';
 }).join("");
 document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>buy(b.dataset.id));
}
function buy(id){
 const u=upgrades.find(x=>x.id===id),lv=levels[id],cost=Math.floor(u.cost*Math.pow(1.65,lv));
 if(money<cost)return;
 money-=cost;levels[id]++;
 if(id==="knife")income+=10;
 if(id==="chef")income+=25;
 if(id==="seat"){income+=40;popularity=Math.min(5,popularity+1)}
 if(id==="shop")income+=100;
 render();
}
startLane();
render();
</script>
</body>
</html>
