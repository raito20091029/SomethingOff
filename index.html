<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="roboforge-build" content="20261004-LANES-FIX">
<title>RoboForge</title>
<style>
:root{--bg:#07101d;--panel:#0d1a2b;--panel2:#12243a;--line:#203852;--text:#eef6ff;--muted:#8ea5bd;--accent:#48d7ff;--accent2:#7c6cff;--good:#62e6a7;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#16304b 0,#07101d 48%,#040913 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{width:100%;max-width:none;margin:0;padding:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border:1px solid #31516e;border-radius:12px;display:grid;place-items:center;background:#0c1c2d;font-size:24px;box-shadow:0 0 24px #48d7ff22}.title{font-size:24px;font-weight:900;letter-spacing:.5px}.sub{font-size:12px;color:var(--muted)}
.money{padding:10px 15px;border:1px solid #31516e;background:#0c1c2d;border-radius:12px;font-weight:800}.money span{color:var(--good)}
.grid{display:grid;grid-template-columns:1fr;gap:8px}.panel{background:linear-gradient(180deg,#0d1a2bf2,#091523f2);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px #0005}.panel h2{font-size:15px;margin:0 0 14px}.factory{min-height:calc(100vh - 70px);height:calc(100vh - 70px);position:relative;overflow:hidden}.floor{position:absolute;inset:92px 18px 18px;border:1px solid #1b344c;border-radius:14px;background:linear-gradient(#0b1827,#08121f);overflow:hidden}.ceiling{position:absolute;left:0;right:0;top:0;height:46px;background:repeating-linear-gradient(90deg,#14283d 0 80px,#0e1d2e 80px 160px);opacity:.65}.machine{position:absolute;left:9%;top:22%;width:36%;height:46%;border:2px solid #2f5875;border-radius:18px;background:linear-gradient(145deg,#142c42,#0a1624);box-shadow:0 0 35px #48d7ff12}.machine:before{content:"";position:absolute;left:18%;right:18%;top:18%;height:38%;border:2px solid #48d7ff66;border-radius:10px;background:#07111d;box-shadow:inset 0 0 25px #48d7ff18}.machine:after{content:"";position:absolute;left:32%;right:32%;bottom:12%;height:15%;border-radius:5px;background:#48d7ff33;box-shadow:0 0 18px #48d7ff55}.robot{position:absolute;right:12%;top:28%;width:22%;height:36%;filter:drop-shadow(0 0 16px #7c6cff55)}.head{position:absolute;left:25%;top:0;width:50%;height:25%;border:2px solid #8394ff;border-radius:9px;background:#182653}.eye{position:absolute;top:42%;width:18%;height:12%;border-radius:50%;background:#62e6a7;box-shadow:0 0 10px #62e6a7}.eye.l{left:23%}.eye.r{right:23%}.body{position:absolute;left:20%;top:29%;width:60%;height:42%;border:2px solid #6476d6;border-radius:12px;background:#121e3d}.arm{position:absolute;top:35%;width:18%;height:38%;border:2px solid #6476d6;border-radius:8px;background:#101a31}.arm.l{left:0;transform:rotate(8deg)}.arm.r{right:0;transform:rotate(-8deg)}.leg{position:absolute;bottom:0;width:18%;height:30%;border:2px solid #6476d6;border-radius:8px;background:#101a31}.leg.l{left:28%}.leg.r{right:28%}
.conveyor{position:absolute;left:0;right:0;bottom:17%;height:34px;background:repeating-linear-gradient(90deg,#182d40 0 24px,#0d1c2a 24px 48px);border-top:2px solid #2d506a;border-bottom:2px solid #2d506a}.factory-lanes{position:absolute;left:2%;right:2%;top:12%;bottom:8%;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;overflow-y:auto;padding-right:0;min-height:0;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}.factory-lanes::-webkit-scrollbar{display:none}.factory-lane{position:relative;flex:0 0 105px;min-height:105px;border:1px solid #1e3a53;border-radius:10px;background:#081522aa;overflow:hidden}.factory-lane .lane-machine{position:absolute;left:3%;top:12%;width:25%;height:76%;border:2px solid #2f5875;border-radius:10px;background:linear-gradient(145deg,#142c42,#0a1624)}.factory-lane .lane-machine:after{content:"";position:absolute;left:25%;right:25%;bottom:12%;height:15%;border-radius:4px;background:#48d7ff33;box-shadow:0 0 12px #48d7ff55}.factory-lane .lane-robot{position:absolute;left:39%;top:19%;width:12%;height:62%;border:2px solid #6476d6;border-radius:7px;background:#121e3d}.factory-lane .lane-robot:before{content:"";position:absolute;left:18%;right:18%;top:-28%;height:28%;border:2px solid #8394ff;border-radius:6px;background:#182653}.factory-lane .lane-conveyor{position:absolute;left:53%;right:0;bottom:23%;height:18px;background:repeating-linear-gradient(90deg,#182d40 0 18px,#0d1c2a 18px 36px);border-top:1px solid #2d506a;border-bottom:1px solid #2d506a}.factory-lane .lane-label{position:absolute;right:8px;top:7px;font-size:10px;color:var(--muted);z-index:2}.lane-progress{position:absolute;left:8%;right:8%;bottom:48px;z-index:20}.lane-progress-row{display:flex;align-items:center;gap:8px;display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:3px}.lane-progress-track{height:7px;border-radius:999px;background:#06101a;border:1px solid #1e3850;overflow:hidden}.lane-progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s}.factory-lane.ready .lane-progress-bar{background:var(--good)}.factory-lane.ready{border-color:#62e6a766;box-shadow:inset 0 0 18px #62e6a711}.factory-lane.ready .lane-label{color:var(--good);font-weight:800}.lane-upgrades{position:absolute;left:2%;right:2%;bottom:3px;display:flex;gap:5px;z-index:3}.lane-up{flex:1;padding:6px 7px;border:1px solid #31516e;border-radius:6px;background:#10243a;font-size:9px;font-weight:800;text-align:left}.lane-up strong{display:block;font-size:10px}.lane-up small{display:block;color:var(--muted);font-weight:700;margin-top:2px}.lane-up:hover{border-color:var(--accent)}.lane-up:disabled{opacity:.4;cursor:not-allowed}.lights{position:absolute;top:16px;left:20px;display:flex;gap:8px}.light{width:9px;height:9px;border-radius:50%;background:#29445b}.light.on{background:var(--good);box-shadow:0 0 10px var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1827}.label{font-size:11px;color:var(--muted)}.value{font-size:19px;font-weight:900;margin-top:3px}
.progress{height:12px;border-radius:999px;background:#06101a;border:1px solid #1e3850;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.primary,.secondary,.upgrade{padding:13px;border-radius:11px;font-weight:850;border:1px solid #31516e;background:#10243a}.primary{background:linear-gradient(135deg,#159bc0,#5365d9);border-color:#64ddff;box-shadow:0 8px 25px #159bc033}.primary:disabled,.upgrade:disabled{opacity:.4;cursor:not-allowed}.secondary:hover,.upgrade:hover{border-color:#48d7ff}.upgrade{width:100%;text-align:left;margin-top:10px}.upgrade strong{display:block}.upgrade small{display:block;color:var(--muted);margin-top:3px}.rf-paused *,.rf-paused *::before,.rf-paused *::after{animation-play-state:paused!important;transition:none!important}.event{min-height:38px;margin-top:12px;color:var(--muted);font-size:13px}.bonus{color:var(--good);font-weight:800}.locked{opacity:.5}.tip{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}.factory-tools{margin-bottom:12px}.factory-status{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px}.factory-status span:last-child{text-align:right}@media(max-width:800px){.factory-status{display:block}.factory-status span:last-child{display:block;text-align:left;margin-top:4px}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.factory{min-height:500px}.stats{grid-template-columns:repeat(3,1fr)}.app{padding:10px}}
.lane-ship{position:relative;z-index:30;pointer-events:auto;margin-left:auto;padding:5px 12px;font-size:12px;border:1px solid #64ddff;border-radius:7px;background:#159bc0;color:#fff;cursor:pointer}.lane-ship:disabled{opacity:.4;cursor:not-allowed}</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand"><div class="logo">🤖</div><div><div class="title">RoboForge</div><div class="sub">Build the factory. Forge the future.</div></div></div>
  <div class="money">💰 <span id="money">100</span> G</div>
</header>

<div class="stats">
  <div class="stat"><div class="label">完成ロボット</div><div class="value" id="robots">0</div></div>
  <div class="stat"><div class="label">稼働レーン</div><div class="value"><span id="speed">1</span> 本</div></div>
  <div class="stat"><div class="label">次のレーン</div><div class="value"><span id="price">250</span> G</div></div>
</div>

<div class="grid">
<section class="panel factory">
  <h2>🏭 生産ライン</h2>
  <div class="factory-tools">
    <div id="event" class="event"></div>
    <div class="factory-status"><span id="laneStatus">稼働中 1本 ・ 出荷待ち 0本</span><span id="lanePotential">次のレーンほどLv.1の生産時間は5%短く、出荷価格は5%高くなります。</span></div>
    <div class="actions">
      <button class="primary" id="ship">📦 出荷して受け取る <span id="shipAmount">0</span> G</button>
      <button class="secondary" id="laneUp">🏭 新しいレーン <span id="laneCost">250</span> G</button>
    </div>
  </div>
  <div class="floor">
    <div class="ceiling"></div>
    <div class="lights"><i class="light on"></i><i class="light on"></i><i class="light"></i><i class="light"></i></div>
    <div id="factoryLanes" class="factory-lanes"></div>
  </div>
</section>


</div>
</div>

<script>
"use strict";
const SAVE_KEY="roboforge-save-v1";
const defaultState={money:100,robots:0,progress:0,speedLv:1,priceLv:1,lanes:1,laneProgress:[0],laneData:[{progress:0,speedLv:1,priceLv:1}]};
let state={...defaultState};
try{
 const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
 if(saved && typeof saved==="object"){
  for(const key of Object.keys(defaultState)){
   if(Number.isFinite(Number(saved[key]))) state[key]=Number(saved[key]);
  }
  state.money=Math.max(0,state.money);
  state.robots=Math.max(0,Math.floor(state.robots));
  state.progress=Math.max(0,Math.min(100,state.progress));
  state.speedLv=Math.max(1,Math.floor(state.speedLv));
  state.priceLv=Math.max(1,Math.floor(state.priceLv));
  state.lanes=Math.max(1,Math.floor(state.lanes));
  const oldProgress=Array.isArray(saved.laneProgress)?saved.laneProgress.map(v=>Math.max(0,Math.min(100,Number(v)||0))):[Math.max(0,Math.min(100,Number(saved.progress)||0))];
  if(Array.isArray(saved.laneData)) state.laneData=saved.laneData.map(v=>({progress:Math.max(0,Math.min(100,Number(v?.progress)||0)),speedLv:Math.max(1,Math.floor(Number(v?.speedLv)||1)),priceLv:Math.max(1,Math.floor(Number(v?.priceLv)||1))}));
  else state.laneData=oldProgress.map((progress,i)=>({progress,speedLv:i===0?state.speedLv:1,priceLv:i===0?state.priceLv:1}));
  while(state.laneData.length<state.lanes) state.laneData.push({progress:0,speedLv:1,priceLv:1});
  state.laneData=state.laneData.slice(0,state.lanes);
  state.lanes=state.laneData.length;
  state.laneProgress=state.laneData.map(lane=>lane.progress);
  state.progress=state.laneData[0]?.progress||0;
 }
}catch(e){}
const $=id=>document.getElementById(id);
function save(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}
}
const laneSpeed=(lane,index=0)=>1/Math.pow(0.95,index+(lane.speedLv-1));
const lanePrice=(lane,index=0)=>25*Math.pow(1.05,index+(lane.priceLv-1));
const laneCost=()=>Math.floor(250*Math.pow(1.5,state.lanes-1));
function renderFactoryLanes(){
 const root=$("factoryLanes");
 root.innerHTML=state.laneData.map((lane,i)=>'<div class="factory-lane'+(lane.progress>=100?' ready':'')+'" data-lane="'+i+'"><div class="lane-label">LINE '+(i+1)+' ・ <span class="lane-percent">'+Math.floor(lane.progress)+'%</span> ・ ⚡'+laneSpeed(lane,i).toFixed(2)+'x ・ 💰'+Math.floor(lanePrice(lane,i))+' G</div><div class="lane-machine"></div><div class="lane-robot"></div><div class="lane-conveyor"></div><div class="lane-progress"><div class="lane-progress-row"><span>生産進捗</span><strong class="lane-percent">'+Math.floor(lane.progress)+'%</strong><button class="lane-ship" data-lane="'+i+'" '+(lane.progress<100?'disabled':'')+'>📦 出荷 <span>'+Math.floor(lanePrice(lane,i))+' G</span></button></div><div class="lane-progress-track"><div class="lane-progress-bar" style="width:'+Math.floor(lane.progress)+'%"></div></div></div><div class="lane-upgrades"><button class="lane-up" data-lane="'+i+'" data-type="speed"><strong>⚡ 速度アップ</strong><small>Lv.'+lane.speedLv+' → Lv.'+(lane.speedLv+1)+'　'+Math.floor(50*Math.pow(1.65,lane.speedLv-1))+' G</small></button><button class="lane-up" data-lane="'+i+'" data-type="price"><strong>💰 価格アップ</strong><small>Lv.'+lane.priceLv+' → Lv.'+(lane.priceLv+1)+'　'+Math.floor(75*Math.pow(1.7,lane.priceLv-1))+' G</small></button></div></div>').join("");
 root.querySelectorAll(".lane-up").forEach(btn=>{btn.disabled=false;btn.addEventListener("click",handleLaneUpgrade)});
 root.querySelectorAll(".lane-ship").forEach(btn=>btn.addEventListener("click",handleLaneShip));
}
function handleLaneShip(e){
 const btn=e.currentTarget;
 const i=Number(btn.dataset.lane);
 const lane=state.laneData[i];
 if(!lane || lane.progress<100)return;
 const earned=Math.floor(lanePrice(lane,i));
 state.money+=earned;
 state.robots++;
 lane.progress=0;
 state.laneProgress=state.laneData.map(l=>l.progress);
 state.progress=state.laneData[0]?.progress||0;
 message("📦 LINE "+(i+1)+"を出荷！ +"+earned+" G",true);
 save();
 render();
}
function handleLaneUpgrade(e){
 const laneIndex=Number(e.currentTarget.dataset.lane);
 const type=e.currentTarget.dataset.type;
 const lane=state.laneData[laneIndex];
 if(!lane)return;
 const cost=type==="speed"?Math.floor(50*Math.pow(1.65,lane.speedLv-1)):Math.floor(75*Math.pow(1.7,lane.priceLv-1));
 if(state.money<cost){message("LINE "+(laneIndex+1)+" の強化には "+cost+" G 必要です。現在は "+Math.floor(state.money)+" G です。");return;}
 state.money-=cost;
 if(type==="speed")lane.speedLv++; else lane.priceLv++;
 message("LINE "+(laneIndex+1)+" の"+(type==="speed"?"生産速度":"出荷価格")+"をLv."+ (type==="speed"?lane.speedLv:lane.priceLv)+" に強化！",true);
 save();render();
}
function updateLaneProgress(){
 const root=$("factoryLanes");
 root.querySelectorAll(".factory-lane").forEach(el=>{
  const i=Number(el.dataset.lane);
  const lane=state.laneData[i];
  if(!lane)return;
  const percent=Math.floor(lane.progress);
  el.classList.toggle("ready",lane.progress>=100);
  el.querySelectorAll(".lane-percent").forEach(node=>node.textContent=percent+"%");
  const bar=el.querySelector(".lane-progress-bar");
  if(bar)bar.style.width=percent+"%";
  const ship=el.querySelector(".lane-ship");
  if(ship)ship.disabled=lane.progress<100;
 });
}
function render(){
 $("money").textContent=Math.floor(state.money);
 $("robots").textContent=state.robots;
 $("speed").textContent=state.lanes;
 $("price").textContent=laneCost();
 $("laneCost").textContent=laneCost();
 $("laneUp").disabled=state.money<laneCost();
 $("ship").disabled=!state.laneData.some(lane=>lane.progress>=100);
 const shipAmount=state.laneData.filter(lane=>lane.progress>=100).reduce((sum,lane,i)=>sum+Math.floor(lanePrice(lane,i)),0);
 $("shipAmount").textContent=shipAmount;
 const ready=state.laneData.filter(lane=>lane.progress>=100).length;
 $("laneStatus").textContent="稼働中 "+state.lanes+"本　・　出荷待ち "+ready+"本";
 $("lanePotential").textContent="次のレーンほどLv.1の生産時間は5%短く、出荷価格は5%高くなります。";
 updateLaneProgress();
}
function message(t,good=false){$("event").innerHTML=good?'<span class="bonus">'+t+"</span>":t}
$("ship").addEventListener("click",()=>{
 const readyLanes=state.laneData.map((lane,index)=>({lane,index})).filter(x=>x.lane.progress>=100);
 if(!readyLanes.length)return;
 const earned=readyLanes.reduce((sum,x)=>sum+Math.floor(lanePrice(x.lane,x.index)),0);
 state.money+=earned;
 state.robots+=readyLanes.length;
 readyLanes.forEach(x=>x.lane.progress=0);
 state.laneProgress=state.laneData.map(lane=>lane.progress);
 state.progress=state.laneData[0]?.progress||0;
 message("📦 "+readyLanes.length+"本を出荷！ +"+earned+" G",true);
 save();
 render();
});
$("laneUp").addEventListener("click",()=>{
 const c=laneCost();if(state.money<c)return;
 state.money-=c;state.lanes++;state.laneData.push({progress:0,speedLv:1,priceLv:1});state.laneProgress=state.laneData.map(lane=>lane.progress);
 message("🏭 新しい生産レーンを追加しました！",true);save();render();
});
let last=performance.now();
let timerId=0;
let backgroundAt=0;

function advanceProduction(dt){
 for(let i=0;i<state.laneData.length;i++){
  const lane=state.laneData[i];
  if(lane.progress<100) lane.progress=Math.min(100,lane.progress+dt*0.0048*laneSpeed(lane,i));
 }
 state.laneProgress=state.laneData.map(lane=>lane.progress);
 state.progress=state.laneData[0]?.progress||0;
}

function loop(){
 const now=performance.now();
 const dt=Math.min(1000,now-last);
 last=now;
 advanceProduction(dt);
 render();
 timerId=setTimeout(loop,100);
}

function enterBackground(){
 if(backgroundAt)return;
 backgroundAt=performance.now();
 clearTimeout(timerId);
 timerId=0;
}

function returnToForeground(){
 if(!backgroundAt)return;
 const now=performance.now();
 const elapsed=Math.max(0,now-backgroundAt);
 backgroundAt=0;
 last=now;
 advanceProduction(elapsed);
 render();
 save();
 if(!timerId)timerId=setTimeout(loop,100);
}

document.addEventListener("visibilitychange",()=>{
 if(document.hidden) enterBackground();
 else returnToForeground();
});
window.addEventListener("blur",enterBackground);
window.addEventListener("focus",()=>{
 if(!document.hidden)returnToForeground();
});

render();
timerId=setTimeout(loop,100);
</script>
</body>
</html>
