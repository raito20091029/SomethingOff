<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>RoboForge</title>
<style>
:root{--bg:#07101d;--panel:#0d1a2b;--panel2:#12243a;--line:#203852;--text:#eef6ff;--muted:#8ea5bd;--accent:#48d7ff;--accent2:#7c6cff;--good:#62e6a7;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#16304b 0,#07101d 48%,#040913 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{max-width:1120px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border:1px solid #31516e;border-radius:12px;display:grid;place-items:center;background:#0c1c2d;font-size:24px;box-shadow:0 0 24px #48d7ff22}.title{font-size:24px;font-weight:900;letter-spacing:.5px}.sub{font-size:12px;color:var(--muted)}
.money{padding:10px 15px;border:1px solid #31516e;background:#0c1c2d;border-radius:12px;font-weight:800}.money span{color:var(--good)}
.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}.panel{background:linear-gradient(180deg,#0d1a2bf2,#091523f2);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px #0005}.panel h2{font-size:15px;margin:0 0 14px}.factory{min-height:460px;position:relative;overflow:hidden}.floor{position:absolute;inset:92px 18px 18px;border:1px solid #1b344c;border-radius:14px;background:linear-gradient(#0b1827,#08121f);overflow:hidden}.ceiling{position:absolute;left:0;right:0;top:0;height:46px;background:repeating-linear-gradient(90deg,#14283d 0 80px,#0e1d2e 80px 160px);opacity:.65}.machine{position:absolute;left:9%;top:22%;width:36%;height:46%;border:2px solid #2f5875;border-radius:18px;background:linear-gradient(145deg,#142c42,#0a1624);box-shadow:0 0 35px #48d7ff12}.machine:before{content:"";position:absolute;left:18%;right:18%;top:18%;height:38%;border:2px solid #48d7ff66;border-radius:10px;background:#07111d;box-shadow:inset 0 0 25px #48d7ff18}.machine:after{content:"";position:absolute;left:32%;right:32%;bottom:12%;height:15%;border-radius:5px;background:#48d7ff33;box-shadow:0 0 18px #48d7ff55}.robot{position:absolute;right:12%;top:28%;width:22%;height:36%;filter:drop-shadow(0 0 16px #7c6cff55)}.head{position:absolute;left:25%;top:0;width:50%;height:25%;border:2px solid #8394ff;border-radius:9px;background:#182653}.eye{position:absolute;top:42%;width:18%;height:12%;border-radius:50%;background:#62e6a7;box-shadow:0 0 10px #62e6a7}.eye.l{left:23%}.eye.r{right:23%}.body{position:absolute;left:20%;top:29%;width:60%;height:42%;border:2px solid #6476d6;border-radius:12px;background:#121e3d}.arm{position:absolute;top:35%;width:18%;height:38%;border:2px solid #6476d6;border-radius:8px;background:#101a31}.arm.l{left:0;transform:rotate(8deg)}.arm.r{right:0;transform:rotate(-8deg)}.leg{position:absolute;bottom:0;width:18%;height:30%;border:2px solid #6476d6;border-radius:8px;background:#101a31}.leg.l{left:28%}.leg.r{right:28%}
.conveyor{position:absolute;left:0;right:0;bottom:17%;height:34px;background:repeating-linear-gradient(90deg,#182d40 0 24px,#0d1c2a 24px 48px);border-top:2px solid #2d506a;border-bottom:2px solid #2d506a}.lights{position:absolute;top:16px;left:20px;display:flex;gap:8px}.light{width:9px;height:9px;border-radius:50%;background:#29445b}.light.on{background:var(--good);box-shadow:0 0 10px var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1827}.label{font-size:11px;color:var(--muted)}.value{font-size:19px;font-weight:900;margin-top:3px}
.progress{height:12px;border-radius:999px;background:#06101a;border:1px solid #1e3850;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.primary,.secondary,.upgrade{padding:13px;border-radius:11px;font-weight:850;border:1px solid #31516e;background:#10243a}.primary{background:linear-gradient(135deg,#159bc0,#5365d9);border-color:#64ddff;box-shadow:0 8px 25px #159bc033}.primary:disabled,.upgrade:disabled{opacity:.4;cursor:not-allowed}.secondary:hover,.upgrade:hover{border-color:#48d7ff}.upgrade{width:100%;text-align:left;margin-top:10px}.upgrade strong{display:block}.upgrade small{display:block;color:var(--muted);margin-top:3px}.rf-paused *,.rf-paused *::before,.rf-paused *::after{animation-play-state:paused!important;transition:none!important}.event{min-height:38px;margin-top:12px;color:var(--muted);font-size:13px}.bonus{color:var(--good);font-weight:800}.locked{opacity:.5}.tip{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.factory{min-height:410px}.stats{grid-template-columns:repeat(3,1fr)}.app{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">🤖</div><div><div class="title">RoboForge</div><div class="sub">Build the factory. Forge the future.</div></div></div>
  <div class="money">💰 <span id="money">100</span> G</div>
</header>

<div class="stats">
  <div class="stat"><div class="label">完成ロボット</div><div class="value" id="robots">0</div></div>
  <div class="stat"><div class="label">生産速度</div><div class="value"><span id="speed">1.0</span>x</div></div>
  <div class="stat"><div class="label">出荷価格</div><div class="value"><span id="price">25</span> G</div></div>
</div>

<div class="grid">
<section class="panel factory">
  <h2>🏭 生産ライン</h2>
  <div class="floor">
    <div class="ceiling"></div>
    <div class="lights"><i class="light on"></i><i class="light on"></i><i class="light"></i><i class="light"></i></div>
    <div class="machine"></div>
    <div class="robot">
      <div class="head"><i class="eye l"></i><i class="eye r"></i></div>
      <div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div>
    </div>
    <div class="conveyor"></div>
  </div>
</section>

<section class="panel">
  <h2>⚙️ 生産管理</h2>
  <div class="row"><span>ロボット製造</span><strong id="pct">0%</strong></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="actions">
    <button class="primary" id="boost">⚡ 生産を加速</button>
    <button class="secondary" id="ship" disabled>📦 出荷する</button>
  </div>
  <div class="event" id="event">ラインを起動しました。</div>

  <h2 style="margin-top:22px">⬆️ 工場アップグレード</h2>
  <button class="upgrade" id="speedUp"><strong>⚡ 生産設備 Lv.<span id="speedLv">1</span></strong><small>生産速度を上げる　・　<span id="speedCost">50</span> G</small></button>
  <button class="upgrade" id="priceUp"><strong>💰 出荷設備 Lv.<span id="priceLv">1</span></strong><small>ロボット1体あたりの価格を上げる　・　<span id="priceCost">75</span> G</small></button>
  <div class="tip">加速はプレイヤー操作による短いブーストです。タイミングよく使うほど、次のロボット完成までを早められます。</div>
</section>
</div>
</div>

<script>
"use strict";
const SAVE_KEY="roboforge-save-v1";
const defaultState={money:100,robots:0,progress:0,speedLv:1,priceLv:1};
let state={...defaultState};
try{
 const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
 if(saved && typeof saved==="object"){
  for(const key of Object.keys(defaultState)){
   if(Number.isFinite(Number(saved[key]))) state[key]=Number(saved[key]);
  }
  state.money=Math.max(0,state.money);
  state.robots=Math.max(0,Math.floor(state.robots));
  state.progress=Math.max(0,Math.min(100,state.progress));
  state.speedLv=Math.max(1,Math.floor(state.speedLv));
  state.priceLv=Math.max(1,Math.floor(state.priceLv));
 }
}catch(e){}
const $=id=>document.getElementById(id);
function save(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}
}
const speed=()=>1+(state.speedLv-1)*0.18;
const price=()=>25+(state.priceLv-1)*12;
const speedCost=()=>Math.floor(50*Math.pow(1.65,state.speedLv-1));
const priceCost=()=>Math.floor(75*Math.pow(1.7,state.priceLv-1));
function render(){
 $("money").textContent=Math.floor(state.money);
 $("robots").textContent=state.robots;
 $("speed").textContent=speed().toFixed(1);
 $("price").textContent=price();
 $("speedLv").textContent=state.speedLv;
 $("priceLv").textContent=state.priceLv;
 $("speedCost").textContent=speedCost();
 $("priceCost").textContent=priceCost();
 $("pct").textContent=Math.floor(state.progress)+"%";
 $("bar").style.width=state.progress+"%";
 $("ship").disabled=state.progress<100;
 $("speedUp").disabled=state.money<speedCost();
 $("priceUp").disabled=state.money<priceCost();
}
function message(t,good=false){$("event").innerHTML=good?'<span class="bonus">'+t+"</span>":t}
$("boost").addEventListener("click",()=>{
 if(state.progress>=100)return;
 state.progress=Math.min(100,state.progress+7);
 message("⚡ 生産ラインを加速！ +7%",true);
 save();
 render();
});
$("ship").addEventListener("click",()=>{
 if(state.progress<100)return;
 const earned=price();
 state.money+=earned;state.robots++;state.progress=0;
 message("📦 ロボットを出荷！ +"+earned+" G",true);
 save();
 render();
});
$("speedUp").addEventListener("click",()=>{
 const c=speedCost();if(state.money<c)return;
 state.money-=c;state.speedLv++;message("⚡ 生産設備を強化しました！",true);save();render();
});
$("priceUp").addEventListener("click",()=>{
 const c=priceCost();if(state.money<c)return;
 state.money-=c;state.priceLv++;message("💰 出荷設備を強化しました！",true);save();render();
});
let last=performance.now();
let lastRender=0;
let frameId=0;
function loop(now){
 const dt=Math.min(60000,now-last);last=now;
 if(state.progress<100){state.progress=Math.min(100,state.progress+dt*0.0048*speed());}
 if(now-lastRender>=100 || state.progress>=100){
   render();
   save();
   lastRender=now;
 }
 frameId=requestAnimationFrame(loop);
}
// 裏画面でもゲーム時間は進行させる。
// ブラウザは裏画面の描画頻度を自動で落とすため、次に処理されたフレームで経過時間をまとめて反映する。
render();
frameId=requestAnimationFrame(loop);
</script>
</body>
</html>
