<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SomethingOff</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0d13;color:#fff;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:18px}
#app{width:min(760px,100%);text-align:center}
#title{margin-bottom:18px}#title h1{font-size:clamp(42px,10vw,78px);margin:0;letter-spacing:6px}#title p{opacity:.65;margin:5px 0 0}
.panel{background:#151923;border:1px solid #ffffff18;border-radius:20px;padding:20px;box-shadow:0 18px 50px #0008}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{background:#0d1017;border:1px solid #fff1;border-radius:12px;padding:9px 5px}.stat small{display:block;opacity:.6}.stat b{font-size:20px}
#event{min-height:100px;display:flex;flex-direction:column;justify-content:center;margin:8px 0 18px}.eventTitle{font-size:24px;font-weight:900}.eventText{opacity:.8;margin-top:5px}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.box{min-height:180px;border:2px solid #ffffff22;background:linear-gradient(145deg,#202637,#10131b);border-radius:18px;color:#fff;cursor:pointer;transition:.15s;box-shadow:0 8px 22px #0006}.box:hover{transform:translateY(-4px);border-color:#fff6}.box:active{transform:scale(.97)}.box .emoji{font-size:64px;display:block;margin:22px 0 12px}.box span{font-size:18px;font-weight:900}.box:disabled{cursor:default;opacity:1}.box.good{border-color:#61e294;background:#153321}.box.bad{border-color:#ef6868;background:#35191d}.box.neutral{border-color:#f2c94c;background:#302a14}
#result{display:none;margin-top:16px;padding:16px;border-radius:14px;background:#0d1017;border:1px solid #fff2}.resultMain{font-size:27px;font-weight:900}.resultSub{opacity:.75;margin-top:4px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}button{font:inherit;border:0;border-radius:11px;padding:12px 18px;background:#fff;color:#111;font-weight:800;cursor:pointer}button.secondary{background:#262c3b;color:#fff;border:1px solid #fff2}button.gold{background:#f2c94c}button:disabled{opacity:.45;cursor:not-allowed}
#startScreen{position:fixed;inset:0;background:#090b10ee;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.startPanel{width:min(520px,94vw);text-align:center}.startPanel h2{font-size:32px;margin:0 0 10px}.startPanel p{line-height:1.7;opacity:.78}.startBtn{font-size:20px;padding:15px 55px;margin-top:8px}
#gameOver{display:none;position:fixed;inset:0;background:#090b10ee;align-items:center;justify-content:center;padding:20px;z-index:20}.overPanel{width:min(500px,94vw);text-align:center}.overPanel h2{font-size:42px;margin:0 0 8px}.big{font-size:30px;font-weight:900}
#shop{margin-top:16px;padding:13px;background:#0d1017;border:1px solid #fff2;border-radius:14px}.shopTitle{font-weight:900;margin-bottom:8px}.shopBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#message{min-height:24px;margin-top:12px;color:#f2c94c;font-weight:800}
@media(max-width:560px){body{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.boxes{gap:8px}.box{min-height:155px}.box .emoji{font-size:52px;margin:18px 0 10px}.panel{padding:13px}.eventTitle{font-size:21px}}
</style></head><body>
<div id="app">
  <div id="title"><h1>SomethingOff</h1><p>THREE BOXES</p></div>
  <div class="panel">
    <div class="stats">
      <div class="stat"><small>ROUND</small><b id="round">1</b></div>
      <div class="stat"><small>🪙 コイン</small><b id="coins">0</b></div>
      <div class="stat"><small>🔥 連続</small><b id="streak">0</b></div>
      <div class="stat"><small>🏆 BEST</small><b id="best">0</b></div>
    </div>
    <div id="event"><div class="eventTitle">3つの箱から1つ選べ！</div><div class="eventText">当たりを引けば報酬アップ。ハズレると痛い。</div></div>
    <div class="boxes">
      <button class="box" data-i="0"><span class="emoji">📦</span><span>箱 A</span></button>
      <button class="box" data-i="1"><span class="emoji">📦</span><span>箱 B</span></button>
      <button class="box" data-i="2"><span class="emoji">📦</span><span>箱 C</span></button>
    </div>
    <div id="result"><div class="resultMain" id="resultMain"></div><div class="resultSub" id="resultSub"></div></div>
    <div class="actions"><button id="bank" class="gold" disabled>💰 報酬を確定</button><button id="continue" disabled>🔥 もう1回</button></div>
    <div id="shop"><div class="shopTitle">🛒 強化</div><div class="shopBtns"><button class="secondary" id="luckBtn">🍀 運UP　100</button><button class="secondary" id="shieldBtn">🛡️ 保険　150</button><button class="secondary" id="doubleBtn">✖️ 次回2倍　250</button></div></div>
    <div id="message"></div>
  </div>
</div>
<div id="startScreen"><div class="panel startPanel"><h2>🎁 3つの箱</h2><p>毎ラウンド、A・B・Cのどれか1つを選ぶ。<br>報酬を確定して帰るか、欲張って次へ進むかはあなた次第。</p><button class="startBtn" id="start">START</button></div></div>
<div id="gameOver"><div class="panel overPanel"><h2>GAME OVER</h2><p id="overReason"></p><div class="big" id="overScore"></div><div id="overBest"></div><div class="actions"><button id="again">もう一度</button></div></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const boxes=[...document.querySelectorAll(".box")];
let state={round:1,coins:0,streak:0,best:Number(localStorage.getItem("so_best")||0),banked:0,luck:0,shield:false,double:false,started:false,chosen:false};
function save(){localStorage.setItem("so_save",JSON.stringify(state));localStorage.setItem("so_best",String(state.best))}
function load(){try{const s=JSON.parse(localStorage.getItem("so_save"));if(s&&typeof s==="object")state={...state,...s}}catch{}}
function update(){
 $("round").textContent=state.round;$("coins").textContent=state.coins;$("streak").textContent=state.streak;$("best").textContent=state.best;
 $("luckBtn").textContent="🍀 運UP　"+(100+state.luck*50);
 $("shieldBtn").textContent=state.shield?"🛡️ 保険　所持":"🛡️ 保険　150";
 $("doubleBtn").textContent=state.double?"✖️ 次回2倍　準備中":"✖️ 次回2倍　250";
}
function message(t){$("message").textContent=t;setTimeout(()=>{if($("message").textContent===t)$("message").textContent=""},1800)}
function startGame(){
 state={...state,round:1,coins:0,streak:0,banked:0,shield:false,double:false,started:true,chosen:false};
 $("startScreen").style.display="none";$("gameOver").style.display="none";resetBoxes();showChoice();update();save();
}
function resetBoxes(){boxes.forEach(b=>{b.disabled=false;b.className="box";b.querySelector(".emoji").textContent="📦"});$("result").style.display="none";$("bank").disabled=true;$("continue").disabled=true}
function showChoice(){
 state.chosen=false;resetBoxes();
 $("event").innerHTML='<div class="eventTitle">🎁 ROUND '+state.round+' — どれを選ぶ？</div><div class="eventText">選んだ箱を開けるまで中身は秘密。</div>';
}
function weightedResult(){
 let r=Math.random();
 const luck=Math.min(.18,state.luck*.03);
 // 連続で当たり続けるほど、ハズレ率を少しずつ上げる救済。
 // 通常時は従来どおり14%。最大で35%まで。
 const pity=Math.min(.21,Math.max(0,state.streak-4)*.035);
 const badChance=Math.min(.35,.14+pity);
 const jackpotChance=Math.max(.01,.08-pity*.45);
 const goodChance=.48+luck;
 const coinChance=.30;
 if(r<badChance)return "bad";
 if(r<badChance+jackpotChance)return "jackpot";
 if(r<badChance+jackpotChance+goodChance)return "good";
 return "coin";
}
function choose(i){
 if(!state.started||state.chosen)return;
 state.chosen=true;boxes.forEach(b=>b.disabled=true);
 const result=weightedResult();
 let gain=0,title="",sub="",cls="";
 if(result==="good"){gain=40+state.round*15;state.streak++;title="✨ 大当たり！";sub="コイン +"+gain;cls="good"}
 if(result==="coin"){gain=20+state.round*8;state.streak++;title="🪙 当たり！";sub="コイン +"+gain;cls="neutral"}
 if(result==="jackpot"){gain=120+state.round*35;state.streak+=2;title="🌟 JACKPOT！";sub="コイン +"+gain;cls="good"}
 if(result==="bad"){
   if(state.shield){state.shield=false;gain=0;state.streak=0;title="🛡️ 保険発動！";sub="ハズレを無効化した！";cls="neutral"}
   else{gain=-Math.max(25,35+state.round*8);state.streak=0;title="💥 ハズレ……";sub="コイン "+gain;cls="bad"}
 }
 if(state.double){gain*=2;state.double=false;sub+="　✖️2倍！"}
 state.coins=Math.max(0,state.coins+gain);
 const b=boxes[i];b.classList.add(cls);b.querySelector(".emoji").textContent=result==="bad"&&!state.shield?"💣":result==="jackpot"?"🌟":gain>0?"💰":"🛡️";
 $("resultMain").textContent=title;$("resultSub").textContent=sub;$("result").style.display="block";
 $("bank").disabled=false;$("continue").disabled=false;
 $("event").innerHTML='<div class="eventTitle">結果が出た！</div><div class="eventText">この報酬を確定する？ それともさらに挑戦する？</div>';
 update();save();
}
function nextRound(){state.round++;state.chosen=false;showChoice();update();save()}
function bank(){
 state.banked=Math.max(state.banked,state.coins);state.best=Math.max(state.best,state.round);
 save();$("overReason").textContent="今回はここで撤退した。";$("overScore").textContent="🪙 "+state.coins+" コイン";$("overBest").textContent="最高記録：ROUND "+state.best;$("gameOver").style.display="flex";
}
$("bank").onclick=bank;
$("continue").onclick=nextRound;
boxes.forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.i))));
$("start").onclick=startGame;$("again").onclick=startGame;
$("luckBtn").onclick=()=>{const cost=100+state.luck*50;if(state.coins>=cost){state.coins-=cost;state.luck++;message("🍀 運が少し上がった！");update();save()}else message("コインが足りない！")};
$("shieldBtn").onclick=()=>{if(state.shield){message("🛡️ 保険はすでに持っている！");return}if(state.coins>=150){state.coins-=150;state.shield=true;message("🛡️ 次のハズレを1回防ぐ！");update();save()}else message("コインが足りない！")};
$("doubleBtn").onclick=()=>{if(state.double){message("すでに2倍を準備中！");return}if(state.coins>=250){state.coins-=250;state.double=true;message("✖️ 次の報酬が2倍！");update();save()}else message("コインが足りない！")};
load();update();
</script></body></html>
